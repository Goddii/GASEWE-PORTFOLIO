<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Godwin Otieno Odhiambo — Creative Engineering Avatar" role="img">
  <defs>
    <!-- Radial glow for core spark -->
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B6FF3B" stop-opacity="1"/>
      <stop offset="40%" stop-color="#B6FF3B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B6FF3B" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradient for high-contrast lighting -->
    <linearGradient id="facetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E8EAE5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#777D78" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="rimLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#B6FF3B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080909" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for luminous bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background containment sphere: subtle orbital grid -->
  <g class="avatar-orbitals" opacity="0.4">
    <circle cx="200" cy="200" r="180" fill="none" stroke="#777D78" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#E8EAE5" stroke-width="1.2" stroke-dasharray="140 40 20 60" opacity="0.5"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#B6FF3B" stroke-width="1" stroke-dasharray="10 80 40 40" opacity="0.6"/>
  </g>

  <!-- Tech coordinates & crosshairs -->
  <g class="avatar-marks" stroke="#777D78" stroke-width="1" opacity="0.6">
    <line x1="20" y1="200" x2="40" y2="200" />
    <line x1="360" y1="200" x2="380" y2="200" />
    <line x1="200" y1="20" x2="200" y2="40" />
    <line x1="200" y1="360" x2="200" y2="380" />
    <!-- Mini corner brackets -->
    <path d="M 60 75 L 50 75 L 50 85" fill="none"/>
    <path d="M 340 75 L 350 75 L 350 85" fill="none"/>
    <path d="M 60 325 L 50 325 L 50 315" fill="none"/>
    <path d="M 340 325 L 350 325 L 350 315" fill="none"/>
  </g>

  <!-- Silhouette & Chiaroscuro Character Artwork -->
  <g id="character-silhouette">
    <!-- Back Head / Hood Silhouette (Deep Obsidian / Graphite) -->
    <path d="M 120 280 C 110 230 115 160 150 110 C 180 70 230 65 270 90 C 305 115 315 160 310 210 C 305 250 280 290 260 320 L 120 280 Z" 
          fill="#0c0e0e" stroke="#777D78" stroke-width="1.5" opacity="0.95"/>

    <!-- Angular Facets: Sculpted Chiaroscuro Planes -->
    <!-- Jaw and cheekbone structure -->
    <polygon points="195,145 235,170 215,225 175,210" fill="#141817" stroke="#777D78" stroke-width="1"/>
    <polygon points="235,170 275,190 260,240 215,225" fill="#1a201e" stroke="#E8EAE5" stroke-width="1.2" opacity="0.8"/>
    
    <!-- Intense High-Contrast Forehead & Brow Line -->
    <path d="M 175 125 L 235 120 L 265 145 L 225 155 Z" fill="url(#facetWhite)" opacity="0.9"/>
    
    <!-- Razor-sharp Jawline / Chin with pure white rim highlight -->
    <path d="M 175 210 L 210 250 L 235 242 L 270 230" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" filter="url(#bloom)"/>

    <!-- Eyeline / Visor: The Electric Lime Beacon -->
    <g class="avatar-eye-beacon">
      <!-- Glow backing -->
      <ellipse cx="230" cy="162" rx="28" ry="12" fill="url(#limeGlow)" opacity="0.85"/>
      <!-- Sharp horizontal scanner line -->
      <line x1="205" y1="162" x2="255" y2="162" stroke="#B6FF3B" stroke-width="3" stroke-linecap="round" filter="url(#bloom)"/>
      <circle cx="232" cy="162" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Torso / High-collar Cybernetic Architecture -->
    <path d="M 130 330 L 170 265 L 225 285 L 215 360 Z" fill="#121514" stroke="#777D78" stroke-width="1.5"/>
    <path d="M 225 285 L 285 260 L 315 330 L 270 360 Z" fill="#171d1b" stroke="#E8EAE5" stroke-width="1.5" opacity="0.9"/>

    <!-- High-collar sharp white rim line -->
    <path d="M 165 268 L 225 288 L 290 258" fill="none" stroke="url(#rimLight)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Embossed GO Monogram Badge on Collar -->
    <g class="avatar-monogram" transform="translate(242, 290)">
      <circle cx="18" cy="18" r="18" fill="#080909" stroke="#B6FF3B" stroke-width="1.5"/>
      <!-- G -->
      <path d="M 14 13 C 10 13 8 15 8 18 C 8 21 10 23 14 23 L 15 23 L 15 18 L 12 18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- O -->
      <circle cx="24" cy="18" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <!-- Micro accent dot -->
      <circle cx="18" cy="27" r="1" fill="#B6FF3B"/>
    </g>
  </g>

  <!-- Technical Overlay HUD elements -->
  <text x="50" y="365" fill="#777D78" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="2">SYS.GO // 254-NBO</text>
  <text x="350" y="365" fill="#B6FF3B" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1" text-anchor="end">ID.ACTIVE</text>
</svg>
